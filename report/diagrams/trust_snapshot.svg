<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f1"/><stop offset="100%" stop-color="#eef4f1"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="480" rx="32" fill="url(#tbg)"/>
  <text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#176b5b">HONEST STATUS</text>
  <text x="48" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#193331">What has been checked  -  and what has not</text>
  <text x="48" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526562">Numbers below describe software and fixture integrity. They are not clinical accuracy scores.</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="48" y="150" width="300" height="180" rx="22" fill="#ffffff" stroke="#d8dfdc" stroke-width="2"/>
    <text x="198" y="230" font-size="56" font-weight="700" fill="#176b5b">8</text>
    <text x="198" y="272" font-size="18" font-weight="700" fill="#193331">fictional reports</text>
    <text x="198" y="300" font-size="13" fill="#526562">synthetic practice set</text>

    <rect x="380" y="150" width="300" height="180" rx="22" fill="#ffffff" stroke="#d8dfdc" stroke-width="2"/>
    <text x="530" y="230" font-size="56" font-weight="700" fill="#176b5b">46</text>
    <text x="530" y="272" font-size="18" font-weight="700" fill="#193331">expected field labels</text>
    <text x="530" y="300" font-size="13" fill="#526562">hand-authored keys</text>

    <rect x="712" y="150" width="300" height="180" rx="22" fill="#ffffff" stroke="#d8dfdc" stroke-width="2"/>
    <text x="862" y="230" font-size="48" font-weight="700" fill="#176b5b">34 / 34</text>
    <text x="862" y="272" font-size="18" font-weight="700" fill="#193331">quote matches</text>
    <text x="862" y="300" font-size="13" fill="#526562">fixture integrity only</text>

    <rect x="1044" y="150" width="308" height="180" rx="22" fill="#ffffff" stroke="#d8dfdc" stroke-width="2"/>
    <text x="1198" y="230" font-size="44" font-weight="700" fill="#176b5b">64 + 10</text>
    <text x="1198" y="272" font-size="18" font-weight="700" fill="#193331">automated checks</text>
    <text x="1198" y="300" font-size="13" fill="#526562">software behavior tests</text>
  </g>

  <rect x="48" y="360" width="1304" height="76" rx="20" fill="#fff8eb" stroke="#f0d7b8" stroke-width="2"/>
  <text x="700" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#b45b13">NO LIVE MODEL EVALUATION  ·  NO CLINICIAN REVIEW  ·  NO PATIENT-OUTCOME CLAIM</text>
  <text x="700" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526562">Lumen remains a synthetic-only prototype. It is not ready for patient use.</text>
</svg>
