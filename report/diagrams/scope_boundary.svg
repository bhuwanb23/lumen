<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f1"/><stop offset="100%" stop-color="#f3efe8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#176b5b">SCOPE SAFETY IS A FEATURE</text>
  <text x="48" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#193331">What Lumen helps with  -  and what it will not do</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="120" width="630" height="340" rx="24" fill="#ffffff" stroke="#cfe3dc" stroke-width="2"/>
    <rect x="48" y="120" width="630" height="64" rx="24" fill="#176b5b"/>
    <rect x="48" y="160" width="630" height="24" fill="#176b5b"/>
    <text x="78" y="160" font-size="20" font-weight="700" fill="#ffffff">Inside the boundary</text>

    <circle cx="92" cy="230" r="10" fill="#176b5b"/>
    <text x="118" y="236" font-size="18" fill="#193331">Explain wording that appears in the excerpt</text>
    <circle cx="92" cy="278" r="10" fill="#176b5b"/>
    <text x="118" y="284" font-size="18" fill="#193331">Show the exact quoted source for each statement</text>
    <circle cx="92" cy="326" r="10" fill="#176b5b"/>
    <text x="118" y="332" font-size="18" fill="#193331">Mark missing information as not stated</text>
    <circle cx="92" cy="374" r="10" fill="#176b5b"/>
    <text x="118" y="380" font-size="18" fill="#193331">Suggest neutral questions for the care team</text>
    <circle cx="92" cy="422" r="10" fill="#176b5b"/>
    <text x="118" y="428" font-size="18" fill="#193331">Fail closed when evidence cannot be supported</text>

    <rect x="722" y="120" width="630" height="340" rx="24" fill="#ffffff" stroke="#f0d7b8" stroke-width="2"/>
    <rect x="722" y="120" width="630" height="64" rx="24" fill="#b45b13"/>
    <rect x="722" y="160" width="630" height="24" fill="#b45b13"/>
    <text x="752" y="160" font-size="20" font-weight="700" fill="#ffffff">Outside the boundary</text>

    <circle cx="766" cy="230" r="10" fill="#b45b13"/>
    <text x="792" y="236" font-size="18" fill="#193331">Diagnose beyond what the report states</text>
    <circle cx="766" cy="278" r="10" fill="#b45b13"/>
    <text x="792" y="284" font-size="18" fill="#193331">Estimate prognosis, survival, or recurrence</text>
    <circle cx="766" cy="326" r="10" fill="#b45b13"/>
    <text x="792" y="332" font-size="18" fill="#193331">Recommend, rank, or dose treatments</text>
    <circle cx="766" cy="374" r="10" fill="#b45b13"/>
    <text x="792" y="380" font-size="18" fill="#193331">Decide clinical-trial eligibility</text>
    <circle cx="766" cy="422" r="10" fill="#b45b13"/>
    <text x="792" y="428" font-size="18" fill="#193331">Triage urgent symptoms or replace clinicians</text>
  </g>
</svg>
